name: CI

# Triggers — main / release-* AND numeric ticket branches.
#
# The canonical sprint workflow (AGENTS.md §6) is stacked ticket PRs:
# each ticket branch (e.g. `33`) targets the predecessor (`32`, or the
# release branch for the first ticket), and every dependent PR base is
# the previous ticket's head. Without a `push`/PR trigger on the
# numeric branches, force-pushes never get CI on their current SHA,
# which breaks the "current-SHA CI green" contract for stacked PRs.
#
# Ticket branches are digit-only identifiers per AGENTS.md §6, so
# `'[0-9]+'` matches the legitimate ticket PRs while excluding arbitrary
# feature branches that happen to share the namespace.
on:
  pull_request:
    branches: [main, 'release-*', '[0-9]+']
  push:
    branches: [main, 'release-*', '[0-9]+']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # corepack is forbidden in this repository (see ADR-0003).
      # pnpm/action-setup@v4 downloads the pnpm 12.3.4 standalone binary
      # directly from pnpm's release CDN; it does not use corepack.
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Head-ref policy: PRs into `main` must originate from a release
      # branch (`release-*`). Solo-developer repos can otherwise accept
      # arbitrary PRs into main, which violates the release-sprint
      # contract in AGENTS.md §6.
      - name: head-ref policy check
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^release-[0-9]+-[0-9]+-[0-9]+$ ]]; then
            echo "::error::PRs into main must have head_ref matching ^release-[0-9]+-[0-9]+-[0-9]+$ (got: $HEAD_REF)"
            exit 1
          fi
      # Read-only validation: format / lint / typecheck / test / build /
      # dry-run / lint:ci (actionlint) / build-storybook.
      # `validate:integration` is the canonical entry point documented in
      # docs/architecture.md and quality/profile.yaml. Workflow YAML lint
      # is part of `validate:integration` via `pnpm run lint:ci` — see
      # scripts/lint-ci.mjs.
      - run: pnpm run validate:integration
      # On push, the worker-configuration.d.ts must match what
      # `wrangler types` produces. Local `pnpm run validate:release`
      # adds the same gate. GitHub Actions expression language does
      # not support regex / length / match, so we keep this gate on
      # every push and let the branch filter above restrict the
      # trigger set to main / release-* / numeric ticket branches.
      - name: cf-typegen check
        if: github.event_name == 'push'
        run: pnpm run cf-typegen:check
      # Playwright E2E is gated to push on main / release-* and to PRs
      # with the `ui-change` label. The push gate does NOT include
      # numeric ticket branches — ticket branches force-push frequently
      # during a sprint, and Playwright install + run is ~3min of
      # runner time that does not change the per-PR review. The
      # webServer block in playwright.config.ts starts `pnpm dev`
      # automatically when PLAYWRIGHT_BASE_URL points at localhost.
      # Browser binaries install with sudo on GitHub Actions runners.
      - name: Install Playwright Chromium
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))) || contains(github.event.pull_request.labels.*.name, 'ui-change')
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))) || contains(github.event.pull_request.labels.*.name, 'ui-change')
        run: pnpm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
      - name: Upload Cloudflare bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist-cloudflare-${{ github.sha }}
          path: dist-cloudflare/
          retention-days: 7
