# my-web-2026 quality profile
#
# Schema_version: 1
# Three deterministic entry points drive both local and CI validation:
#
#   - validate:fast         local feedback (read-only)
#   - validate:integration  ticket PR verification (build + dry-run +
#                           actionlint via lint:ci + build-storybook)
#   - validate:release      pre-`main` verification (cf-typegen check + Playwright)
#
# Coverage thresholds are intentionally disabled at 0.1.0; see ADR-0007.
# Component-level cost comes from the framework-native tools listed
# in `components`. Do not add hidden steps inside workflow YAML.
#
# Issue #492 adds one cheap gate that is neither of the three
# entry points: `routes:quality:check` keeps the published route
# roster and its quality-gate coverage in sync. See the
# `route_quality_coverage` block below.

schema_version: 1

stack:
  runtime: cloudflare-workers@2026-09-07
  framework: tanstack-start@1.168.x
  build: vite@7.1.x
  ui: react@19.2.x
  external_boundary: hono@4.13.x
  styling: panda-css@1.12.x
  format_lint: biome@1.9.x
  workflow_lint: actionlint@latest
  test_runner: vitest@4.1.x
  worker_test: '@cloudflare/vitest-plugin@1.1.x'
  language: typescript@5.9.x
  package_manager: pnpm@12.3.4

gates:
  fast:
    command: 'pnpm run validate:fast'
    components:
      - 'pnpm run format:check' # biome format (read-only)
      - 'pnpm run lint:check' # biome lint (read-only)
      - 'pnpm run architecture:check' # obligation dependency direction
      # Issue #414: the Web feature adoption gate. Offline and vendored
      # (quality/browser-baseline.json pins the web-features Baseline
      # snapshot), so it costs a directory walk and never a network call.
      # Below the Baseline Widely available bar an adoption is a warning
      # only when its fallback requirement is declared AND its evidence
      # still matches the working tree; an adoption without a fallback
      # fails.
      - 'pnpm run compat:check' # Baseline Web feature adoption gate (browser compatibility)
      # Issue #433: the Unicode / URL-slug policy is enforced on the
      # shipped surface, and the gate prints the shared decision table
      # classified with the real owner grammars.
      - 'pnpm run i18n:policy:check' # no implicit normalization / locale
      # Issue #423: robots.txt / sitemap.xml / per-route noindex meta must
      # agree with the generated route inventory. Runs as a fast gate
      # because it is a pure Node script (no worker, no build).
      - 'pnpm run index:boundary:check' # index boundary (robots / sitemap / meta robots)
      - 'pnpm run sbom:check' # CycloneDX inventory vs. the real lockfile (Issue #471)
      - 'pnpm run install:scripts:check' # dependency install lifecycle script audit (Issue #474)
      # Issue #473: Tool submodule supply-chain provenance. Offline,
      # status-only: proves manifest pin == gitlink == checked-out commit
      # == build-artefact stamp, and that the fetch source is the declared
      # credential-free https repository with no branch-tip tracking.
      - 'pnpm run tools:provenance:check'
      - 'pnpm run csrf:contract:check' # CSRF rejection contract (Issue #440)
      - 'pnpm run typecheck' # tsc --noEmit
      # `pnpm run test` also carries the Issue #491 D1 statement-count
      # budget (src/portfolio/load.query-budget.test.ts): the portfolio
      # list surface must stay at or below 1 + 2 * ceil(pageSize / 100)
      # D1 statements. It is deliberately an assertion inside the EXISTING
      # `test` component, not a new gate: statement counts are
      # deterministic, whereas wall-clock time is reported as an
      # observation only (Lighthouse / Web Vitals budgets are #384-#386).
      - 'pnpm run test' # vitest run (unit + integration SELF)
    cost_class: cheap
    trigger: local + every CI run

  integration:
    command: 'pnpm run validate:integration'
    components:
      - fast
      - 'pnpm run build' # vite build -> dist/, Tool artifacts, Build Output sync
      - 'pnpm run build:cf:production' # cf build -> .cloudflare/output/v0/
      - 'pnpm run build:cf:verify' # Build Output completeness (Worker bundle + Tool artifacts + mode)
      - 'pnpm run deploy:cf:prebuilt:dry-run' # cf deploy --prebuilt --mode production --dry-run
      - 'pnpm run cf:mode-mismatch:check' # a production Build Output must be rejected under --mode development
      - 'pnpm run lint:ci' # actionlint via scripts/lint-ci.mjs (default target: .github/workflows/*.yml)
      - 'pnpm run build-storybook' # static storybook build -> storybook-static/
      # Issue #247: Storybook's Vite builder merges the project's
      # `vite.config.ts`, so it runs the Cloudflare plugin and DESTROYS
      # `.cloudflare/output/` (config.json and the Worker bundles; only
      # `workers/default/assets` survives). The Playwright step that runs
      # after this command starts `vite preview`, which serves the Build
      # Output, and failed with "no root config found at
      # .cloudflare/output/v0/config.json".
      #
      # The Build Output is therefore rebuilt after Storybook, and the
      # contract re-checked against it. Reordering instead (Storybook
      # first) was tried and reverted: in a fresh CI process Panda's
      # PostCSS plugin fails on its FIRST load with
      # "Loading PostCSS Plugin failed: Cannot read properties of
      # undefined (reading 'exports')", which the original order masked
      # by having `build:production` pay that cost first. That is a
      # pre-existing latent toolchain issue, tracked separately; the
      # build order here should not depend on it.
      - 'pnpm run build:cf:production' # rebuild Build Output after Storybook
      - 'pnpm run cloudflare:contract:check:build' # re-prove the contract against the fresh artifact
    cost_class: medium
    trigger: pull_request, push_to_main_and_release

  release:
    command: 'pnpm run validate:release'
    components:
      - integration
      # cf-typegen:check regenerates .cloudflare/types/index.d.ts (cf
      # workers types) AND fails if the result is not byte-identical to
      # what is committed. A bare `cf workers types` would always pass.
      - 'pnpm run cf-typegen:check'
    cost_class: medium
    trigger: push_to_main_and_release

change_risk_mapping:
  doc_only:
    gate: fast
  config_only:
    gate: fast
  client_bundle_report_change:
    gate: fast
    note: 'Issue #483 — scripts/_client-bundle.mjs + scripts/report-client-bundle.mjs + its fixture test. The analyser has a unit test (`scripts/_client-bundle.test.mjs`) that `pnpm run test` runs inside validate:fast, so the analyser cannot silently stop detecting an orphaned chunk or a leaking Tool import. The REPORT it produces is not a gate and no byte budget is enforced here: budget thresholds are Issue #383 / #385.'
  src_unit:
    gate: fast
  architecture_boundary:
    gate: fast
    note: 'scripts/check-architecture.mjs rejects reverse owner dependencies; src/home/status/** may use the documented runtime health edges and registered home→http schema edges must be import type only'
  binding_change:
    gate: integration
    note: 'cloudflare.config.ts + .cloudflare/types/index.d.ts must be in the same PR'
  entrypoint_change:
    gate: integration
    note: 'src/server.ts, vite.config.ts, cloudflare.config.ts worker.entrypoint'
  ci_workflow_change:
    gate: integration
    note: '.github/workflows/*.yml requires actionlint pass + cf-typegen:check'
  dependency_or_supply_chain_change:
    gate: fast
    note: 'scripts/check-sbom.mjs rejects an SBOM whose npm inventory, digests or Tool pins drift from pnpm-lock.yaml / src/tools/manifest.json, and rejects secret-shaped content or a runtime-secret name from scripts/_cloudflare-contract.mjs'
  release_branch:
    gate: release

# Issue #492 — the published route roster and its quality-gate
# coverage are one reviewable artefact, and a cheap gate keeps the two
# in sync. This is a **coverage ledger**: it proves every published
# route has a decision (covered with evidence, or excluded with a
# reason). It does not run Lighthouse, axe, or a second browser engine.
route_quality_coverage:
  manifest: 'quality/route-coverage.json'
  route_source: 'src/routes/** (files calling createFileRoute)'
  generated_route_tree: 'src/routeTree.gen.ts'
  command: 'pnpm run routes:quality:check'
  report_command: 'pnpm run routes:quality:report'
  tests: 'node --test scripts/check-route-quality-coverage.test.mjs'
  gate: fast
  gate_placement: >-
    validate:fast, immediately before `pnpm run test` and after `pnpm run
    publication:check` (the chain order belongs to release-0-6-3, so
    this records the neighbouring steps rather than an absolute index).
  documentation: 'docs/verification/quality/route-quality-coverage.md'
  gate_families:
    - 'e2e' # implemented — Playwright spec asserts the rendered surface
    - 'seo' # implemented — canonical / Open Graph metadata assertion
    - 'a11y' # planned — axe-core scan (not yet ticketed)
    - 'performance' # planned — Lighthouse (#384 measures, #385 gates, #386 budgets)
    - 'cross_browser' # planned — a second browser engine (CI is Chromium-only)
    - 'security_headers' # planned — response security-header assertion
  scope_note: >-
    Measurement of a11y / performance / cross_browser / security_headers
    is explicitly out of scope here and belongs to #384-#387. Adding a
    family to this ledger does not add a gate; flipping a family from
    `planned` to `implemented` requires evidence for at least one route.
  addition_rule: >-
    A new route file with no manifest entry fails the gate on purpose, so
    a ticket PR must either add the route as a gate target or record an
    exclusion reason for every gate family.

ci:
  workflow: .github/workflows/ci.yml
  # Single job. `validate:integration` runs on every PR and every
  # push to main / release-*. The cf-typegen:check step and the
  # Playwright E2E step run only on push to main / release-* plus on
  # pull requests that opt in via the `ui-change` label (Playwright
  # E2E only — cf-typegen:check is not meaningful on a draft PR).
  #
  # Issue #486: the image CLS regression spec
  # (`e2e/image-cls.spec.ts`) rides this same Playwright step. No new
  # job, trigger, script or budget entry was added for it — a CLS
  # budget is #386's axis, and re-running the E2E step on another
  # trigger is a `disallowed_patterns` violation. The recorded impact
  # is in `docs/verification/perf/README.md`.
  jobs:
    - name: validate
      command: 'pnpm run validate:integration'
      triggers:
        - pull_request
        - push_to_main
        - push_to_release_branch
      release_extra:
        - 'pnpm run cf-typegen:check'
        - 'pnpm run e2e'
      # Every step in the `validate` job, in workflow order. Listed
      # explicitly so no step can appear in workflow YAML without an
      # entry here (profile header: "Do not add hidden steps inside
      # workflow YAML"). `pnpm run sbom:check` is NOT a step of its
      # own — it runs inside `validate:fast`, which the first command
      # above already covers; the two SBOM steps below only materialise
      # and retain the document after the gate has passed. The two
      # dependency advisory steps come from the release trunk (Issue
      # #470) and are listed here so the inventory stays complete in
      # merged order.
      steps_after_validate_integration:
        - name: Dependency advisory audit
          run: 'pnpm run dep-audit:check -- --report .tmp/dependency-audit-report.html'
        - name: Upload dependency advisory report
          uses: actions/upload-artifact@v4
          note: 'artifact dependency-advisory-report-<sha>, 90 day retention (see security_gates.dependency_review.ci_step)'
        - name: Build SBOM
          run: 'pnpm run sbom:build'
        - name: Upload SBOM
          uses: actions/upload-artifact@v4
          note: 'artifact sbom-<sha>, 90 day retention (see security_gates.sbom.ci_artifact)'
  required_checks:
    public_repo_main: ['validate']
    public_repo_release_pr: ['validate']
  concurrency:
    cancel_in_progress: true
    group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  bootstrap:
    pnpm_version: 12.3.4
    bun_version: 1.4.2 # same_origin_static readmark Tool build (#215)
    node_version: 22.18 # >=22.18: cloudflare.config.ts is loaded by Node and cannot load under Bun
    cache_path: '~/.local/share/pnpm/store'
    cache_key: 'pnpm-${{ runner.os }}-${{ hashFiles(''pnpm-lock.yaml'') }}'
    install_args: '--frozen-lockfile'

# Issue #415 - cross-engine compatibility gate.
#
# Deliberately NOT a `validate:*` entry point. It re-runs the ALREADY
# BUILT Worker through three Playwright engines and publishes a matrix;
# folding it into `validate:integration` would multiply the required
# `validate` check by three and merge two different questions ("does the
# build pass" / "does the public surface render everywhere"). AGENTS.md
# 5 keeps the three deterministic entry points as they are.
compat:
  workflow: .github/workflows/compat.yml
  local_command: 'pnpm run e2e:compat'
  report_command: 'pnpm run verify:compat-screenshot'
  config: playwright.compat.config.ts
  specs: 'e2e/compat/**'
  engines:
    - chromium
    - firefox
    - webkit
  preconditions:
    - 'pnpm run build (vite preview serves the built Worker)'
    - 'pnpm run e2e:compat:install (all three engine binaries)'
  negative_control: 'e2e/compat/negative-control.spec.ts'
  artefacts:
    - path: '.tmp/compat-results.json'
      source: 'Playwright JSON reporter'
    - path: '.tmp/compat-matrix.html'
      source: 'scripts/make-compat-matrix-report.mjs'
    - path: 'playwright-report/'
      source: 'Playwright html reporter (CI only)'
    - path: 'docs/verification/compat/browsers-matrix.webp'
      source: 'committed verification screenshot (Issue #415 PR evidence)'
  os_differential:
    note: >-
      `workflow_dispatch` takes a `runner` input (ubuntu-latest /
      macos-latest) so an engine behaviour that differs per host can be
      measured on both instead of assumed. The current known
      differential is recorded in docs/development.md.
  cost_class: medium

coverage_policy:
  enabled: false
  rationale: 'ADR-0007 — coverage thresholds are deferred to 0.2.0; coverage data is not collected at 0.1.0.'

compatibility:
  # Issue #414 — browser compatibility is a first-class gate, not a
  # bundler side effect. Panda emits plain CSS and Vite emits plain JS,
  # so nothing else in the toolchain would ever ask whether a Web API or
  # CSS feature runs on the browsers we support.
  bar: 'baseline-widely-available'
  manifest: 'quality/browser-baseline.json'
  dataset: 'web-features (vendored snapshot; refreshed out-of-band, re-verified with --dataset)'
  command: 'pnpm run compat:check'
  fixture_suite: 'node --test scripts/check-browser-baseline.test.mjs'
  report: 'pnpm run verify:browser-baseline-screenshot'
  semantics:
    above_bar: 'pass (declared in features[] with its Baseline status)'
    below_bar_with_verified_fallback: 'warning (fallback requirement is explicit and its evidence is re-checked against the working tree)'
    below_bar_without_fallback: 'fail'
    guarded_feature_adopted: 'fail (must be registered with a Baseline status and a fallback first)'
    warning_only:
      - 'below_baseline_with_fallback'
      - 'target_floor_unverifiable — no adopted feature is Baseline Widely available, so the declared floor cannot be compared with the bar-implied floor (the comparison is reported as not run rather than skipped silently)'
    silent_pass_guards:
      - 'a declared surface that matches no file fails'
      - 'a scanned source file owned by no declared surface fails'
      - 'a scanned path claimed by two surfaces fails (it would be counted twice)'
      - 'a declared feature with no unsuppressed occurrence fails'
      - 'a declared fallback whose evidence file/pattern vanished fails'
      - 'a declared false-positive waiver that suppresses nothing fails'
      - 'a declared target-browser floor below the Baseline-implied floor fails'
    known_limits:
      - 'regex detection: comments match the same patterns as live declarations, for both feature detection and fallback evidence'
      - 'registry model: an adoption that nobody declares in features[] / guarded_features[] is not detected at all'

security_gates:
  secret_scanning:
    enabled: true
    mode: asynchronous
    note: 'Enabled via GitHub Push Protection + cloud bot.'
  sbom:
    enabled: true
    issue: '#471'
    format: cyclonedx-1.6
    check_command: 'pnpm run sbom:check'
    build_command: 'pnpm run sbom:build'
    report_command: 'pnpm run sbom:report'
    ci_artifact: 'sbom-<sha> (actions/upload-artifact@v4, 90 day retention)'
    inputs:
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - src/tools/manifest.json
    note: 'Fail-closed on inventory drift, digest mismatch (SHA-512 per component and SHA-256 provenance per tracked input), dangling graph edges, components carrying properties CycloneDX 1.6 does not define, and secret-shaped content or a runtime-secret name from scripts/_cloudflare-contract.mjs. The generator reads only the listed tracked files — no environment credential, .dev.vars, Infisical export or Worker secret value (AGENTS.md section 4). See docs/runbook/sbom.md.'
  install_script_audit:
    enabled: true
    tool: scripts/check-install-scripts.mjs
    policy: quality/install-scripts.json
    execution_allowlist: pnpm-workspace.yaml#allowBuilds
    note: >-
      Issue #474. pnpm is default-deny for dependency build scripts; this
      gate fails when an installed package can execute code during an
      install (preinstall / install / postinstall, an implicit node-gyp
      rebuild for a package shipping binding.gyp, or the prepare of a
      git-hosted dependency) that the reviewed policy has no record for,
      when the policy decision and pnpm's effective execution allow-list
      disagree in either direction, when a grant survives only in the
      legacy onlyBuiltDependencies list, or when an allowed package
      moved to a version the record never reviewed. It warns when an
      allow-list entry buys no build. Status-only output; no secret value
      is read or printed. Runbook: docs/runbook/install-script-audit.md
  submodule_provenance:
    enabled: true
    tool: 'scripts/check-submodule-provenance.mjs'
    gate: fast
    mode: offline_status_only
    note: 'Issue #473 — manifest pin / gitlink / checked-out commit / build-artefact stamp agreement, plus fetch-source identity and branch-tip rejection. No network fetch, no environment variable and no secret file is read, every finding is status-only, and a URL that came from the ambient git config is printed with its userinfo / query / fragment redacted.'
  workflow_yaml_lint:
    enabled: true
    tool: actionlint
    note: 'Biome does not cover .github/workflows/*.yml. Runs inside the `validate` job.'
  dependency_review:
    enabled: true
    issue: '#470'
    tool: pnpm-audit
    check_command: 'pnpm run dep-audit:check'
    report_command: 'pnpm run dep-audit:report'
    declaration: 'quality/dependency-advisory-gate.json'
    enforcement: audit
    blocking_severities: ['critical', 'high']
    open_owner_decision: '`enforcement: audit` with 18 outstanding blocking advisories (3 critical) is the shipped state. Remediation, narrowing blocking_severities and per-package exception approval are owner calls; no exception is written on the owner''s behalf. See docs/runbook/dependency-advisories.md section 6.'
    ci_step: 'Dependency advisory audit (every pull_request / push the workflow triggers, and the HTML report is uploaded as dependency-advisory-report-<sha>)'
    entry_points: 'CI only — the gate needs the npm registry advisory endpoint, so it is deliberately not part of the offline validate:fast / validate:integration / validate:release path. The decision lives in scripts/check-dependency-advisories.mjs (not in workflow YAML) and the same verdict is reproducible locally with `pnpm run dep-audit:check`.'
    exit_codes:
      0: 'pass, or blocking findings recorded under audit enforcement'
      1: 'blocking advisories outstanding under block enforcement'
      2: 'usage error, unreadable --input path, or gate-declaration error'
      3: 'advisory data unavailable — fail closed, never reported as 0 findings'
    inputs:
      - pnpm-lock.yaml
      - quality/dependency-advisory-gate.json
    note: 'Severity policy, the exception ledger and every expiry live in the declaration, not in code, so a policy change is a reviewable one-line diff. The severity policy is enforced in both directions: a severity classified as neither blocking nor reported fails closed, and an exception is keyed by (advisoryId, package) because one advisory commonly spans several packages — a record that matches no finding suppresses nothing and is reported, never laundered into `data unavailable`. Advisory data comes from the npm registry advisory endpoint only — no environment credential, .dev.vars, Infisical export or Worker secret value (AGENTS.md section 4); an upstream response body is never echoed into stdout or the artifact. Unreadable data fails closed so a registry outage cannot read as a clean tree. See docs/runbook/dependency-advisories.md.'
  sast:
    enabled: false
    rationale: 'Deferred.'
  container_scanning:
    enabled: false
    rationale: 'No Containerfile at 0.1.0.'

disallowed_patterns:
  - 'format script that mutates source files (--write) inside a validation gate'
  - 'CI workflow with multiple jobs that re-run the same validate:* script on the same trigger'
  - 'duplicate pnpm install across CI jobs (use cache + single shared bootstrap)'
  - 'tabs in YAML files (actionlint enforces spaces; .github/workflows/*.yml uses 2-space indent)'
  - 'cf workers types run as a generation step in CI without a subsequent git diff --exit-code check'
  - 'a performance/visualisation report wired into validate:fast / validate:integration / validate:release (see diagnostic_entry_points; budgets are Issue #383 / #385)'

# Deterministic entry points that produce EVIDENCE without gating.
# They are deliberately outside `gates:` above: running them must never
# turn a visualisation into a release condition. A finding from one of
# them is an input to a human decision or to a follow-up Issue.
#
# `pnpm run verify:bundle-map` (Issue #483) reads an emitted client build
# and reports, per route, which chunks load, how large they are, which
# chunks are duplicated, and whether any host route pulls in the Tool
# artifacts under `tools/**`. Reproduction conditions (source SHA, node,
# vite, OS/arch, CPU, browser, network) are part of the report body,
# because a bundle number without its conditions is not comparable.
#
# Local reproduction (production-equivalent preview):
#   pnpm exec vite build && node scripts/build-tools.mjs
#   node scripts/sync-cf-build-output.mjs
#   node scripts/e2e-local-bootstrap.mjs --port=3000   # terminal 1
#   pnpm run verify:bundle-map -- --base-url=http://127.0.0.1:3000
#
# CI reproduction: the same command against the same build step that
# `validate:integration` runs, plus `--screenshot=` to refresh the
# committed WebP. No workflow runs it today — it is opt-in, invoked by a
# human, and a workflow that starts running it must keep it out of the
# `gates:` above.
diagnostic_entry_points:
  - name: verify:bundle-map
    command: 'pnpm run verify:bundle-map -- --base-url=<preview base url>'
    scope: 'client build output only; no network, no Cloudflare API, no production read'
    output: '.tmp/bundle-report/bundle-map.{json,md,html} (gitignored)'
    committed_artefacts:
      - 'docs/verification/perf/bundle-map.md'
      - 'docs/verification/perf/bundle-map.webp'
    gates: none
    owner_issue: '#483'
    prerequisites: 'a built client output (pnpm exec vite build; scripts/build-tools.mjs + scripts/sync-cf-build-output.mjs for Tool artefacts) and, for the route matrix, a preview server'
