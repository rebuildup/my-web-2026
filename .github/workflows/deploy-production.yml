name: deploy production

# Canonical production delivery.
#
# Release PR merge is the human authorization boundary. Deployment starts only after
# the normal CI workflow succeeds for the resulting main SHA. workflow_dispatch is a
# recovery/rerun path and is accepted only from main.
#
# Required GitHub Actions secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
# - BETTER_AUTH_SECRET
# - MY_WEB_2026_CONSUMER_API_KEY
#
# The home consumer key is stable across deploys. The workflow only ensures that its
# hash row exists in D1; the plaintext is never printed.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to rebuildup.dev
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://rebuildup.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      MY_WEB_2026_CONSUMER_API_KEY: ${{ secrets.MY_WEB_2026_CONSUMER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - name: Validate production secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BETTER_AUTH_SECRET"
          test -n "$MY_WEB_2026_CONSUMER_API_KEY"

      - run: pnpm run build

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.production.jsonc

      - name: Ensure home consumer API key
        run: pnpm run ensure:home-api-key:remote

      - name: Prepare Worker secrets file
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('/tmp/my-web-2026-secrets.json', JSON.stringify({
            BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET,
            MY_WEB_2026_CONSUMER_API_KEY: process.env.MY_WEB_2026_CONSUMER_API_KEY,
          }));
          NODE
          chmod 600 /tmp/my-web-2026-secrets.json

      - name: Deploy Worker and secrets together
        run: pnpm exec wrangler deploy -c wrangler.production.jsonc --secrets-file /tmp/my-web-2026-secrets.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f /tmp/my-web-2026-secrets.json

      - name: Disable stale home consumer keys
        run: pnpm run ensure:home-api-key:remote -- --disable-stale

  smoke:
    name: verify production
    needs: deploy
    uses: ./.github/workflows/prod-smoke.yml
