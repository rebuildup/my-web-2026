<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>HTML standards gate — valid fixture</title>
		<link rel="stylesheet" href="/assets/valid.css" />
	</head>
	<body>
		<a href="#main">本文へ</a>
		<main id="main">
			<h1>Valid fixture</h1>
			<p>
				A paragraph that may only contain phrasing content, so this <em>emphasis</em> and this
				<a href="/about" rel="author">link</a> are both allowed.
			</p>
			<h2>Second level</h2>
			<ul>
				<li>one</li>
				<li>two</li>
			</ul>
			<p>
				<img src="/assets/valid.webp" alt="検証用のローカル画像" width="160" height="90" loading="lazy" />
			</p>
			<form method="post" action="/api/v1/reactions/home-page">
				<label for="reaction-note">note</label>
				<input id="reaction-note" name="note" type="text" maxlength="140" required />
				<button type="submit">send</button>
			</form>
			<table>
				<caption>gate 表</caption>
				<thead>
					<tr>
						<th scope="col">rule</th>
						<th scope="col">severity</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td headers="rule-severity">duplicate-id</td>
						<td>error</td>
					</tr>
				</tbody>
			</table>
			<p id="rule-severity" hidden>column definition</p>
		</main>
	</body>
</html>
